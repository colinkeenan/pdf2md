          fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M32 4 v10 a2 2 0 0 0 2 2 h10" fill="#d8d8d8" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="1" y="20" width="30" height="13" rx="2" fill="#d93025"/>
    <text x="16" y="30.4" font-family="sans-serif" font-weight="bold" font-size="10.5"
