[package]
name = "pdf2md-app"
version = "0.1.0"
edition = "2021"
description = "KDE Kirigami front end for pdf2md"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
pdf2md-core = { path = "../core" }
trash = "5.3.0"

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }
